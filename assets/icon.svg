<!--
  The Hoodini mark: an H whose right leg carries a wallet flap.

  Vector rather than the supplied raster, because this has to render at 16px as
  well as 128px. A 1240px source downsampled to 16 turns the flap's outline into
  grey mush; drawn at each size, the shapes stay on the pixel grid.

  Proportions are taken off the supplied artwork, normalised to a 128 grid:
  stems 18 wide and 72 tall, crossbar 24 deep at mid-height, and the flap a
  17-deep capsule sitting inside that band, rounded at the left and squared off
  flush with the right stem.

  Two variants ship. `#mark` is the full drawing. `#mark-small` drops the
  outline and enlarges the clasp, because a 1.2-unit separation at 128 is a
  seventh of a pixel at 16 — it does not survive, and what it leaves behind is a
  smudge where a crisp shape should be.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- The full mark, for 48px and above. -->
    <g id="mark">
      <!-- The H. The crossbar runs the whole gap; the flap is cut out of it and
           the right stem together, which is what makes the pocket read as sitting
           on the leg rather than beside it. -->
      <rect x="32" y="28" width="18" height="72" rx="3.2" />
      <rect x="79" y="28" width="18" height="72" rx="3.2" />
      <rect x="49" y="52" width="31" height="24" rx="1.5" />

      <!-- Knocked out in the ground colour, then redrawn inset: the gap between
           pocket and body is the dark of the tile showing through, not a stroke. -->
      <path d="M76.5 56.6 H98.4 V73.4 H76.5 a8.4 8.4 0 0 1 0 -16.8 z" fill="#0E2A20" />
      <path d="M77.8 57.9 H97.1 V72.1 H77.8 a7.1 7.1 0 0 1 0 -14.2 z" />
      <circle cx="84" cy="65" r="2.5" fill="#0E2A20" />
    </g>

    <!-- 16px and below: the same silhouette, with the flap stated as a solid
         notch and the clasp as one legible dot rather than an outline. -->
    <g id="mark-small">
      <rect x="32" y="28" width="18" height="72" rx="2" />
      <rect x="79" y="28" width="18" height="72" rx="2" />
      <rect x="49" y="52" width="31" height="24" rx="1" />
      <path d="M75 55 H99 V75 H75 a10 10 0 0 1 0 -20 z" fill="#0E2A20" />
      <path d="M77 57 H97 V73 H77 a8 8 0 0 1 0 -16 z" />
      <circle cx="84" cy="65" r="3.6" fill="#0E2A20" />
    </g>
  </defs>

  <rect width="128" height="128" fill="#0E2A20" />
  <use href="#mark" fill="#2FCB5D" />
</svg>
